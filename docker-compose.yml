services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/tracker.db
      BACKUP_DIR: /app/data/backups
      TRUST_PROXY: "true"
    volumes:
      - app_data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TRACK_DOMAIN: ${TRACK_DOMAIN:?defina TRACK_DOMAIN no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_data:
  caddy_data:
  caddy_config:
